services:
  watch-video:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pre-download this Whisper model at build time.
        # Options: tiny | base | small | medium | large-v3
        # Omit to skip pre-caching (saves image size, model downloads on first run).
        WHISPER_MODEL: small
    image: watch-video:latest
    volumes:
      # Mount the directory that contains your video files.
      # Adjust the left side to point at your actual video folder.
      - ./videos:/data/videos:ro
      # Output lands here — writable.
      - ./watch-video-out:/data/out
    # Override CMD to process a specific video:
    #   docker compose run watch-video /data/videos/recording.mp4 --out /data/out
    #
    # Or with a URL (needs network access):
    #   docker compose run watch-video https://loom.com/share/XXX --out /data/out
    command: ["--help"]
    # Increase for large videos / heavy Whisper models
    # mem_limit: 8g

  # Optional one-shot processor: mounts a single video from the host
  # and exits when done.  Useful for CI / scripted pipelines.
  process:
    build:
      context: .
      dockerfile: Dockerfile
    image: watch-video:latest
    volumes:
      - ${VIDEO_FILE:-./videos}:/data/input:ro
      - ${OUTPUT_DIR:-./watch-video-out}:/data/out
    command:
      - /data/input
      - --out
      - /data/out
      - --model
      - ${WHISPER_MODEL:-small}
    profiles:
      - process
