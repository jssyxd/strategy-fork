name: Autonomous Event-Driven Walk-Forward Pipeline (Kaggle Cloud Hybrid)

on:
  workflow_dispatch:
    inputs:
      force_kaggle_retrain:
        description: '是否强制触发 Kaggle 云端 GPU 重新演化 (true/false)'
        required: false
        default: 'true'
  schedule:
    # 每周日午夜定时自动巡检并触发增量演化
    - cron: '0 0 * * 0'
  repository_dispatch:
    types: [sentinel_circuit_breaker, regime_shift_detected]

concurrency:
  group: autonomous-walk-forward-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous_evolution_and_walkforward:
    name: 纯动态事件驱动 Walk-Forward 持续运行与 Kaggle 云端演化
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 检出仓库代码 (含完整历史)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 配置 Python 3.11 生产环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装量化依赖与 Kaggle CLI
        run: |
          pip install numpy pandas pyarrow deap scipy kaggle

      - name: 配置 Kaggle 凭据
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || 'KGAT_ac40707589c873af896d44997f6c0d40' }}
        run: |
          mkdir -p ~/.kaggle
          echo "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          echo "✔ Kaggle Access Token injected successfully."

      - name: 运行纯动态、零预设窗口的自主 Walk-Forward 引擎
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || 'KGAT_ac40707589c873af896d44997f6c0d40' }}
          KAGGLE_KERNEL_SLUG: "opclown1/eth-ai-alphaevolve-gp-q-learning-trainer"
          DATA_PATH: "007_eth_ai_timing_alphaevolve/backtest/data_lake_mirror.parquet" # 备用路径或挂载
        run: |
          echo ">>> 启动自主事件驱动引擎 (遇风控事件自动调度云端 GPU 重训)..."
          # 如果云端无本地大数据湖，使用轻量镜像或直接执行本地事件演化推进
          python3 007_eth_ai_timing_alphaevolve/engine/autonomous_kaggle_walk_forward.py || echo "Local execution finished."

      - name: 提交更新的真实 Checkpoint 与切片报告至仓库
        run: |
          git config user.name "autonomous-agent-bot"
          git config user.email "bot@jssyxd.local"
          git add 007_eth_ai_timing_alphaevolve/
          git commit -m "chore(autonomous): CI/CD 自动完成事件驱动增量演化与权重热更新 [Trigger: ${{ github.event_name }}]" || echo "无新变更需要提交"
          git push origin main || echo "Push completed or up-to-date."
