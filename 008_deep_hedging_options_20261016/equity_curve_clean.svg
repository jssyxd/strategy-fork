<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="lossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Background Grid -->
  <line x1="50" y1="60" x2="750" y2="60" stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8"/>
  <line x1="50" y1="110" x2="750" y2="110" stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8"/>
  <line x1="50" y1="160" x2="750" y2="160" stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8"/>
  <line x1="50" y1="210" x2="750" y2="210" stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8"/>
  <line x1="50" y1="260" x2="750" y2="260" stroke="#64748b" stroke-width="1.2"/>
  
  <!-- Training Loss Convergence Curve -->
  <path d="M 100,70 L 240,140 L 380,185 L 520,215 L 660,230 L 660,260 L 100,260 Z" fill="url(#lossGrad)" />
  <path d="M 100,70 L 240,140 L 380,185 L 520,215 L 660,230" fill="none" stroke="#8b5cf6" stroke-width="2.6" stroke-linecap="round"/>
  
  <circle cx="100" cy="70" r="4.5" fill="#8b5cf6"/>
  <circle cx="240" cy="140" r="4.5" fill="#8b5cf6"/>
  <circle cx="380" cy="185" r="4.5" fill="#8b5cf6"/>
  <circle cx="520" cy="215" r="4.5" fill="#8b5cf6"/>
  <circle cx="660" cy="230" r="5.5" fill="#10b981"/>
  
  <!-- Y Axis Labels -->
  <text x="42" y="74" fill="#94a3b8" font-size="11" text-anchor="end">0.170</text>
  <text x="42" y="154" fill="#94a3b8" font-size="11" text-anchor="end">0.130</text>
  <text x="42" y="234" fill="#94a3b8" font-size="11" text-anchor="end">0.105</text>
  
  <!-- X Axis Labels -->
  <text x="100" y="282" fill="#94a3b8" font-size="11" text-anchor="middle">Epoch 1</text>
  <text x="240" y="282" fill="#94a3b8" font-size="11" text-anchor="middle">Epoch 2</text>
  <text x="380" y="282" fill="#94a3b8" font-size="11" text-anchor="middle">Epoch 3</text>
  <text x="520" y="282" fill="#94a3b8" font-size="11" text-anchor="middle">Epoch 4</text>
  <text x="660" y="282" fill="#94a3b8" font-size="11" text-anchor="middle">Epoch 5 (0.1057)</text>
  
  <!-- Title & Legend -->
  <text x="50" y="32" fill="#f8fafc" font-size="15" font-weight="bold">深度学习三任务对冲网络训练损失收敛轨迹 (Loss 0.1648 → 0.1057)</text>
  <circle cx="560" cy="28" r="4.5" fill="#8b5cf6"/>
  <text x="572" y="32" fill="#cbd5e1" font-size="12">多任务联合损失 (Vol + Corr + CVaR)</text>
