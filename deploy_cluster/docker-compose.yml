services:
  strat_012_eth_dynamic:
    image: nautilus_cluster_base:latest
    container_name: nautilus_local_001_eth
    restart: unless-stopped
    command: ["python", "-u", "/app/services/01_eth_dynamic/run_live.py"]
    environment:
      - OKX_API_KEY=c0020735-b707-4084-9718-d3dd68173ebd
      - OKX_API_SECRET=548F11F8FEFEB8A02CC127900908CD15
      - OKX_API_PASSPHRASE=Auto111.
      - OKX_SIMULATED_TRADING=1
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 150M

