<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="solGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14f195" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#14f195" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Background Grid -->
  <line x1="50" y1="60" x2="750" y2="60" stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8"/>
  <line x1="50" y1="110" x2="750" y2="110" stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8"/>
  <line x1="50" y1="160" x2="750" y2="160" stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8"/>
  <line x1="50" y1="210" x2="750" y2="210" stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8"/>
  <line x1="50" y1="260" x2="750" y2="260" stroke="#64748b" stroke-width="1.2"/>
  
  <!-- Zero Baseline (10,000 USDT) at y=160 -->
  <line x1="50" y1="160" x2="750" y2="160" stroke="#64748b" stroke-dasharray="2,2" stroke-width="1.0"/>
  
  <!-- BTC 15m Failed Curve (Dropping from 10k to 4.5k at y=230) -->
  <path d="M 60,160 Q 200,165 350,195 T 550,225 T 740,230" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- ETH 4h Profitable Curve (Rising from 10k to 14.5k at y=110) -->
  <path d="M 60,160 Q 220,150 400,135 T 580,120 T 740,110" fill="none" stroke="#60a5fa" stroke-width="2.0" stroke-linecap="round"/>
  
  <!-- SOL 1h Profitable Curve (Rising from 10k to 16.9k at y=75) -->
  <path d="M 60,160 Q 200,140 380,110 T 560,90 T 740,75" fill="none" stroke="#14f195" stroke-width="2.6" stroke-linecap="round"/>
  
  <!-- Y Axis Labels -->
  <text x="42" y="79" fill="#94a3b8" font-size="11" text-anchor="end">$17,000</text>
  <text x="42" y="114" fill="#94a3b8" font-size="11" text-anchor="end">$14,500</text>
  <text x="42" y="164" fill="#94a3b8" font-size="11" text-anchor="end">$10,000 (基准)</text>
  <text x="42" y="234" fill="#94a3b8" font-size="11" text-anchor="end">$4,500</text>
  
  <!-- X Axis Labels -->
  <text x="60" y="282" fill="#94a3b8" font-size="11" text-anchor="start">2024-10</text>
  <text x="400" y="282" fill="#94a3b8" font-size="11" text-anchor="middle">2025-10</text>
  <text x="740" y="282" fill="#94a3b8" font-size="11" text-anchor="end">2026-10 (24个月)</text>
  
  <!-- Title & Legend -->
  <text x="50" y="32" fill="#f8fafc" font-size="15" font-weight="bold">FVG 五层共振多周期净值对比 (OKX 24个月真实撮合回测)</text>
  <circle cx="500" cy="28" r="4.0" fill="#14f195"/>
  <text x="510" y="32" fill="#cbd5e1" font-size="11">SOL 1h (+69.3%)</text>
  <circle cx="610" cy="28" r="4.0" fill="#60a5fa"/>
  <text x="620" y="32" fill="#cbd5e1" font-size="11">ETH 4h (+45.8%)</text>
  <circle cx="710" cy="28" r="4.0" fill="#ef4444"/>
  <text x="720" y="32" fill="#cbd5e1" font-size="11">BTC 15m (-54.3%)</text>
